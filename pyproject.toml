[project]
name = "economic-intelligence"
version = "0.1.0"
description = "Enterprise AI economic intelligence and data integration platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"