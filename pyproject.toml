[project]
name = "economic-intelligence"
version = "0.1.0"
description = "Enterprise AI economic intelligence and data integration platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "openai>=3.0",
]

[project.optional-dependencies]
# Dev/test-only -- never required at runtime, never installed in production.
# Increment 010: the first committed automated test suite (previously all
# verification was ad hoc, never repeatable). pytest is the only addition;
# nothing here is imported by app/ at runtime.
# Increment #26D: pyyaml added so tests/test_release_architecture.py can
# parse .github/workflows/ci.yml as real, structured YAML (job/step
# presence, absence of a `secrets.` reference) rather than fragile
# string matching -- also test-only, never imported by app/ at runtime.
dev = ["pytest", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Scope package discovery to the actual application package. Without this,
# newer setuptools versions refuse to build (flat-layout auto-discovery
# finds both app/ and alembic/ as top-level packages and won't guess which
# one is intended) -- unrelated to this increment, but newly blocking a
# plain `pip install -e .`, so fixed here rather than worked around.
include = ["app*"]

[tool.pytest.ini_options]
# Minimum config: tests/ is the only place pytest looks, run from repo
# root. No coverage plugin, no fixture framework beyond what's in
# tests/conftest.py (shared) and each suite's own conftest.py.
testpaths = ["tests"]
markers = [
    "integration: requires an isolated, explicitly-configured PostgreSQL test database (TEST_DATABASE_URL) -- run with `pytest -m integration`, or exclude with `pytest -m \"not integration\"`.",
    "api: FastAPI TestClient tests against the deterministic HTTP routes -- also requires TEST_DATABASE_URL (routes read/write through the real session_scope). Run with `pytest -m api`, or exclude with `pytest -m \"not api\"`.",
]
# Testability blocker found during Increment 010, root-caused during
# Increment 011 (see the journal): the project's own editable install
# (`pip install -e .`) does not actually make `import app` resolve
# outside of `python -m pytest`'s incidental "cwd on sys.path" behavior.
# Root cause (confirmed, not a setuptools/pyproject.toml misconfiguration
# at all): the generated `__editable__...pth` file intermittently carries
# the OS-level "hidden" file flag in this development environment: Python
# 3.12's site.py deliberately skips any .pth file with that flag set (a
# real, documented CPython security hardening behavior), silently
# disabling the editable-install import hook. Confirmed to reappear even
# immediately after clearing it and after a full reinstall, i.e. it is
# not durably fixable from here -- environment-specific, unrelated to
# this project's actual packaging configuration. This repo root is added
# to pytest's own import path instead: a test-runner-only setting,
# unaffected by the above, with zero effect on application runtime
# behavior.
pythonpath = ["."]